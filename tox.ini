[tox]
envlist = py310, py311, py312
isolated_build = true

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312

[testenv]
description = Run the SPyCCI test suite
deps =
    -r{toxinidir}/requirements_ci.txt
commands =
    python -m pytest tests/units -vvv --color=yes -ra --maxfail=0